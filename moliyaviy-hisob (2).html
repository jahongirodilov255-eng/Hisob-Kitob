<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ulush Hisob-Kitob Daftari</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#E3ECDF;
    --paper-deep:#D6E2D0;
    --line:#B4C7AC;
    --ink:#1E2B22;
    --ink-soft:#51624F;
    --brass:#B8863B;
    --brass-dark:#8C6425;
    --debt:#A13B2D;
    --debt-bg:#F6E3DE;
    --profit:#2F6B4F;
    --card:#F4F7F1;
    --white:#FBFBF8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    background-image:linear-gradient(var(--line) 1px, transparent 1px);
    background-size:100% 34px;
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
  }
  .wrap{ max-width:1000px; margin:0 auto; padding:28px 20px 60px; }
  .masthead{
    display:flex; justify-content:space-between; align-items:flex-end;
    border-bottom:3px double var(--ink);
    padding-bottom:14px; margin-bottom:22px; flex-wrap:wrap; gap:12px;
  }
  .masthead h1{ font-family:'Source Serif 4', serif; font-weight:700; font-size:29px; margin:0; }
  .masthead .sub{ font-size:12.5px; color:var(--ink-soft); margin-top:4px; font-style:italic; }
  .datebox{
    font-family:'IBM Plex Mono', monospace; font-size:12px; color:var(--ink-soft);
    text-align:right; border:1px solid var(--line); padding:6px 10px; background:var(--card);
  }

  .hero{ display:grid; grid-template-columns:1.2fr 1fr 1fr; gap:14px; margin-bottom:26px; }
  @media (max-width:700px){ .hero{ grid-template-columns:1fr 1fr; } }
  .stat{
    background:var(--card); border:1px solid var(--line); border-top:3px solid var(--brass);
    padding:14px 16px;
  }
  .stat.profit{ border-top-color:var(--profit); }
  .stat.debt{ border-top-color:var(--debt); }
  .stat .label{ font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft); margin-bottom:6px; }
  .stat .value{ font-family:'IBM Plex Mono', monospace; font-size:22px; font-weight:600; }
  .stat.profit .value{ color:var(--profit); }
  .stat.debt .value{ color:var(--debt); }

  .layout{ display:grid; grid-template-columns:190px 1fr; gap:20px; }
  @media (max-width:700px){ .layout{ grid-template-columns:1fr; } }

  .tabs{ display:flex; flex-direction:row; gap:6px; overflow-x:auto; }
  @media (min-width:701px){ .tabs{ flex-direction:column; } }
  .tab{
    background:var(--card); border:1px solid var(--line); border-left:4px solid var(--brass);
    padding:10px 12px; cursor:pointer; font-family:'Source Serif 4', serif; font-size:13.5px;
    white-space:nowrap; transition:background .15s;
  }
  .tab:hover{ background:var(--paper-deep); }
  .tab.active{ background:var(--brass); border-left-color:var(--brass-dark); color:var(--white); }
  .tab .pct{ display:block; font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .tab.active .pct{ color:#f4e8d6; }
  .tab.all{ border-left-color:var(--ink-soft); font-style:italic; }

  section.card{ background:var(--card); border:1px solid var(--line); padding:18px; margin-bottom:20px; }
  h2{ font-family:'Source Serif 4', serif; font-size:17px; margin:0 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line); }

  form{ display:flex; flex-direction:column; gap:10px; max-width:480px; }
  label{ font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.06em; margin-bottom:-4px; }
  input, select{
    font-family:'IBM Plex Sans', sans-serif; font-size:14px; padding:8px 9px;
    border:1px solid var(--line); background:var(--white); color:var(--ink);
  }
  input:focus, select:focus{ outline:2px solid var(--brass); outline-offset:1px; }
  .row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .checkrow{ display:flex; align-items:center; gap:8px; font-size:13px; padding:6px 0; }
  .checkrow input{ width:16px; height:16px; }
  .live-share{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; color:var(--profit); min-height:16px; }
  button{
    margin-top:4px; background:var(--ink); color:var(--white); border:none;
    padding:10px 14px; font-size:13.5px; font-weight:600; cursor:pointer; letter-spacing:.03em;
  }
  button:hover{ background:var(--profit); }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  thead th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-soft); border-bottom:2px solid var(--ink); padding:6px 8px;
  }
  tbody td{ padding:9px 8px; border-bottom:1px solid var(--line); font-family:'IBM Plex Mono', monospace; font-size:13px; }
  tbody tr td.amt{ color:var(--profit); }
  tbody tr td.share{ color:var(--ink); font-weight:600; }
  tbody tr.nasiya{ background:var(--debt-bg); }
  tbody tr.nasiya td{ color:var(--debt); font-weight:600; }
  .badge{
    display:inline-block; font-family:'IBM Plex Sans', sans-serif; font-size:10px;
    text-transform:uppercase; letter-spacing:.05em; padding:2px 6px; border-radius:2px; margin-left:6px;
  }
  .badge.nasiya{ background:var(--debt); color:white; }
  .badge.tolandi{ background:var(--ink-soft); color:white; }
  .link-btn{
    background:none; border:none; color:var(--ink-soft); font-size:11.5px;
    text-decoration:underline; cursor:pointer; padding:2px 4px; margin:0;
  }
  .link-btn:hover{ color:var(--debt); background:none; }
  .link-btn.pay{ color:var(--profit); }
  .empty{ color:var(--ink-soft); font-style:italic; font-size:13px; padding:14px 4px; }

  .breakdown{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:6px; }
  .bd-item{ border:1px solid var(--line); background:var(--white); padding:10px; }
  .bd-item .name{ font-family:'Source Serif 4',serif; font-size:13.5px; }
  .bd-item .pct{ font-size:11px; color:var(--ink-soft); }
  .bd-item .num{ font-family:'IBM Plex Mono', monospace; font-size:14px; margin-top:4px; }
  .bd-item .num.share{ color:var(--profit); font-weight:600; }

  .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px; }
  .reset{ background:none; color:var(--debt); border:1px solid var(--debt); padding:5px 10px; font-size:11.5px; }
  .reset:hover{ background:var(--debt); color:white; }
  .export{ background:none; color:var(--profit); border:1px solid var(--profit); padding:5px 10px; font-size:11.5px; margin:0; }
  .export:hover{ background:var(--profit); color:white; }
  .loading{ color:var(--ink-soft); font-style:italic; font-size:13px; }
</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1>Ulush Hisob-Kitob Daftari</h1>
      <div class="sub">5 loyihadan tushgan pul va mening ulushim</div>
    </div>
    <div class="datebox" id="todayBox"></div>
  </div>

  <div class="hero" id="heroStats"></div>

  <div class="layout">
    <div class="tabs" id="tabs"></div>

    <div>
      <section class="card">
        <h2>Tushum yozish</h2>
        <form id="incomeForm">
          <label>Loyiha</label>
          <select id="incSource" required></select>
          <div class="row2">
            <div>
              <label>Sana</label>
              <input type="date" id="incDate" required>
            </div>
            <div>
              <label>Summa (so'm)</label>
              <input type="number" id="incAmount" min="0" step="1" placeholder="0" required>
            </div>
          </div>
          <div class="live-share" id="liveShare"></div>
          <div class="checkrow">
            <input type="checkbox" id="incNasiya">
            <label style="margin:0; text-transform:none; letter-spacing:0;" for="incNasiya">Nasiya (pul hali qo'lga tegmagan, qarz)</label>
          </div>
          <button type="submit">+ Tushumni qo'shish</button>
        </form>
      </section>

      <section class="card">
        <div class="toolbar">
          <h2 style="border:none; margin:0; padding:0;" id="tableTitle">Barcha yozuvlar</h2>
          <div style="display:flex; gap:8px;">
            <button class="export" id="exportBtn">Excelga yuklab olish</button>
          </div>
        </div>
        <div id="tableWrap"><div class="loading">Yuklanmoqda...</div></div>
      </section>

      <section class="card">
        <h2>Loyihalar bo'yicha taqsimot</h2>
        <div class="breakdown" id="breakdown"></div>
      </section>
    </div>
  </div>
</div>

<script>
const SOURCES = [
  { name: "CODERS", pct: 20 },
  { name: "JAVOHIR", pct: 50 },
  { name: "BOTS MANAGER", pct: 30.76 },
  { name: "RAHIMOV", pct: 16.66 },
  { name: "DONIK", pct: 40 },
];

const STORAGE_KEY = "ledger-income-v2";
let data = { income: [] };
let activeFilter = "ALL";

function fmt(n){
  return Math.round(n).toLocaleString("uz-UZ").replace(/,/g, " ") + " so'm";
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }

document.getElementById("todayBox").textContent = new Date().toLocaleDateString("uz-UZ", {year:"numeric", month:"long", day:"numeric"});
document.getElementById("incDate").value = todayStr();

function populateSourceSelect(){
  const sel = document.getElementById("incSource");
  sel.innerHTML = SOURCES.map(s => `<option value="${s.name}">${s.name} — ulushim ${s.pct}%</option>`).join("");
}
populateSourceSelect();

function populateTabs(){
  const tabs = document.getElementById("tabs");
  let html = `<div class="tab all ${activeFilter==='ALL'?'active':''}" data-src="ALL">Barchasi</div>`;
  html += SOURCES.map(s => `
    <div class="tab ${activeFilter===s.name?'active':''}" data-src="${s.name}">
      ${s.name}
      <span class="pct">Ulushim: ${s.pct}%</span>
    </div>`).join("");
  tabs.innerHTML = html;
  tabs.querySelectorAll(".tab").forEach(el=>{
    el.addEventListener("click", ()=>{ activeFilter = el.dataset.src; render(); });
  });
}

async function loadData(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      data.income = parsed.income || [];
    }
  }catch(e){
    console.log("Hozircha saqlangan ma'lumot yo'q, yangidan boshlanmoqda.", e);
  }
  render();
}

async function saveData(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }catch(e){
    console.error("Storage xatosi:", e);
    alert("Ma'lumotni saqlashda xatolik yuz berdi. Qaytadan urinib ko'ring.");
  }
}

function updateLiveShare(){
  const srcName = document.getElementById("incSource").value;
  const amount = parseFloat(document.getElementById("incAmount").value) || 0;
  const src = SOURCES.find(s=>s.name===srcName);
  const share = amount * (src.pct/100);
  document.getElementById("liveShare").textContent = amount>0
    ? `Sizning ulushingiz: ${fmt(share)} (${src.pct}%)`
    : "";
}
document.getElementById("incSource").addEventListener("change", updateLiveShare);
document.getElementById("incAmount").addEventListener("input", updateLiveShare);

document.getElementById("incomeForm").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const srcName = document.getElementById("incSource").value;
  const src = SOURCES.find(s=>s.name===srcName);
  const amount = parseFloat(document.getElementById("incAmount").value);
  const date = document.getElementById("incDate").value;
  const nasiya = document.getElementById("incNasiya").checked;
  if(!amount || amount<=0) return;
  data.income.push({
    id: uid(),
    source: src.name,
    pct: src.pct,
    amount,
    share: amount * (src.pct/100),
    date,
    nasiya,
    paid: false
  });
  await saveData();
  document.getElementById("incAmount").value = "";
  document.getElementById("incNasiya").checked = false;
  document.getElementById("liveShare").textContent = "";
  render();
});

async function markPaid(id){
  const item = data.income.find(x=>x.id===id);
  if(item){ item.paid = true; await saveData(); render(); }
}
async function deleteIncome(id){
  data.income = data.income.filter(x=>x.id!==id);
  await saveData(); render();
}

document.getElementById("exportBtn").addEventListener("click", ()=>{
  if(!data.income || data.income.length===0){
    alert("Eksport qilish uchun hali yozuv yo'q.");
    return;
  }
  const rows = [...data.income].sort((a,b)=> (a.date<b.date?-1:1));

  const sheetData = [
    ["Sana", "Loyiha", "Ulush foizi (%)", "Tushgan summa (so'm)", "Mening ulushim (so'm)", "Holati"]
  ];
  rows.forEach(r=>{
    let holati = "Naqd";
    if(r.nasiya) holati = r.paid ? "Nasiya edi — to'landi" : "Nasiya — hali to'lanmagan";
    sheetData.push([r.date, r.source, r.pct, r.amount, Math.round(r.share), holati]);
  });

  const totalIncome = rows.reduce((a,b)=>a+b.amount,0);
  const paidShare = rows.filter(i=>!i.nasiya || i.paid).reduce((a,b)=>a+b.share,0);
  const debtTotal = rows.filter(i=>i.nasiya && !i.paid).reduce((a,b)=>a+b.amount,0);

  sheetData.push([]);
  sheetData.push(["", "", "", "JAMI TUSHUM:", Math.round(totalIncome), ""]);
  sheetData.push(["", "", "", "QO'LIMDAGI ULUSHIM (NAQD):", Math.round(paidShare), ""]);
  sheetData.push(["", "", "", "NASIYADAGI QARZ (TO'LIQ SUMMA):", Math.round(debtTotal), ""]);

  const ws = XLSX.utils.aoa_to_sheet(sheetData);
  ws['!cols'] = [{wch:12},{wch:16},{wch:14},{wch:18},{wch:18},{wch:24}];

  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Hisob-kitob");

  const fname = `hisob-kitob-${todayStr()}.xlsx`;
  XLSX.writeFile(wb, fname);
});

function render(){
  populateTabs();
  renderStats();
  renderTable();
  renderBreakdown();
}

function renderStats(){
  const filtered = activeFilter==="ALL" ? data.income : data.income.filter(i=>i.source===activeFilter);
  const totalIncome = filtered.reduce((a,b)=>a+b.amount,0);
  const paidShare = filtered.filter(i=>!i.nasiya || i.paid).reduce((a,b)=>a+b.share,0);
  const debtTotal = filtered.filter(i=>i.nasiya && !i.paid).reduce((a,b)=>a+b.amount,0);

  const hero = document.getElementById("heroStats");
  hero.innerHTML = `
    <div class="stat profit">
      <div class="label">Qo'limdagi ulushim (naqd)${activeFilter!=="ALL" ? " — "+activeFilter : ""}</div>
      <div class="value">${fmt(paidShare)}</div>
    </div>
    <div class="stat">
      <div class="label">Jami tushum</div>
      <div class="value">${fmt(totalIncome)}</div>
    </div>
    <div class="stat debt">
      <div class="label">Nasiyadagi qarz (to'liq summa)</div>
      <div class="value">${fmt(debtTotal)}</div>
    </div>
  `;
}

function renderTable(){
  const title = document.getElementById("tableTitle");
  title.textContent = activeFilter==="ALL" ? "Barcha yozuvlar" : `${activeFilter} — yozuvlar`;

  let rows = data.income.filter(i => activeFilter==="ALL" || i.source===activeFilter);
  rows = [...rows].sort((a,b)=> (a.date<b.date?1:-1));

  const wrap = document.getElementById("tableWrap");
  if(rows.length===0){
    wrap.innerHTML = `<div class="empty">Hali yozuv yo'q. Yuqoridagi shakldan bugungi tushumni qo'shing.</div>`;
    return;
  }

  let html = `<table><thead><tr>
    <th>Sana</th><th>Loyiha</th><th>Tushgan summa</th><th>Mening ulushim</th><th></th>
  </tr></thead><tbody>`;

  rows.forEach(r=>{
    const isDebt = r.nasiya && !r.paid;
    html += `<tr class="${isDebt?'nasiya':''}">
      <td>${r.date}</td>
      <td>${r.source}
        ${r.nasiya ? (r.paid ? `<span class="badge tolandi">To'landi</span>` : `<span class="badge nasiya">Nasiya</span>`) : ""}
      </td>
      <td class="amt">${fmt(r.amount)}</td>
      <td class="share">${fmt(r.share)} <span style="color:var(--ink-soft); font-weight:400;">(${r.pct}%)</span></td>
      <td>
        ${isDebt ? `<button class="link-btn pay" onclick="markPaid('${r.id}')">to'landi deb belgilash</button>` : ""}
        <button class="link-btn" onclick="deleteIncome('${r.id}')">o'chirish</button>
      </td>
    </tr>`;
  });

  html += `</tbody></table>`;
  wrap.innerHTML = html;
}

function renderBreakdown(){
  const bd = document.getElementById("breakdown");
  bd.innerHTML = SOURCES.map(s=>{
    const items = data.income.filter(i=>i.source===s.name);
    const total = items.reduce((a,b)=>a+b.amount,0);
    const share = items.reduce((a,b)=>a+b.share,0);
    return `<div class="bd-item">
      <div class="name">${s.name}</div>
      <div class="pct">Ulushim: ${s.pct}%</div>
      <div class="num">Jami tushum: ${fmt(total)}</div>
      <div class="num share">Mening ulushim: ${fmt(share)}</div>
    </div>`;
  }).join("");
}

loadData();
</script>
</body>
</html>
